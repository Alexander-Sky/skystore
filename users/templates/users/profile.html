{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h2>Профиль пользователя</h2>
    <p><strong>Email:</strong> {{ user.email }}</p>
    <p><strong>Телефон:</strong> {{ user.phone|default:"не указан" }}</p>
    <p><strong>Страна:</strong> {{ user.country|default:"не указана" }}</p>
    {% if user.avatar %}
        <img src="{{ user.avatar.url }}" alt="Аватар" width="150">
    {% endif %}
    <a href="{% url 'users:profile_edit' %}" class="btn btn-secondary mt-3">Редактировать профиль</a>
</div>
{% endblock %}
