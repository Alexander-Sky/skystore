{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{{ post.title }}</h1>
    <p><small>Дата создания: {{ post.created_at }}</small></p>
    <p><small>Просмотров: {{ post.views_count }}</small></p>

    {% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid mb-3" alt="{{ post.title }}">
    {% endif %}

    <p>{{ post.content|linebreaks }}</p>

    <div class="mt-3">
        <a href="{% url 'blog:edit' post.pk %}" class="btn btn-secondary">Редактировать</a>
        <a href="{% url 'blog:delete' post.pk %}" class="btn btn-danger">Удалить</a>
        <a href="{% url 'blog:list' %}" class="btn btn-outline-primary">Вернуться к списку</a>
    </div>
</div>
{% endblock %}
