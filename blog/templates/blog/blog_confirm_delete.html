{% extends 'catalog/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>Удалить статью</h1>
    <p>Вы уверены, что хотите удалить статью <strong>"{{ post.title }}"</strong>?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Да, удалить</button>
        <a href="{% url 'blog:detail' object.pk %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
